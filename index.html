<!DOCTYPE html>
<html lang="vi">
<head>
<base target="_top">
<title>90 Days Rich Habits</title>
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0B2F20">
<meta name="apple-mobile-web-app-title" content="Siêu Nhẩm">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<noscript><link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet"></noscript>
<style>
:root{
  --bg:#0A120E; --card:#1B2B22; --ink:#EEF4EC; --muted:#8CA095; --line:#26342C;
  --primary:#B8F061; --primary-soft:rgba(184,240,97,.14);
  --mint:#4FC98A; --mint-soft:rgba(79,201,138,.14);
  --peach:#FF9F72; --peach-soft:rgba(255,159,114,.14);
  --lav:#5FD6A0; --lav-soft:rgba(95,214,160,.14);
  --gold:#F5C444; --gold-soft:rgba(245,196,68,.14);
  --pink:#FF6F91;
  --r:18px; --shadow:0 6px 24px rgba(0,0,0,.35);

  --cellc:#22302A; --h1:#1F5A3C; --h2:#2F8F5F; --h3:#4FC98A; --h4:#B8F061;
}
:root[data-theme=light]{
  --bg:#EDF4EB; --card:#FFFFFF; --ink:#12261A; --muted:#5F766A; --line:#DCE8DC;
  --primary:#2A8A55; --primary-soft:#E2F3E7;
  --mint:#2FB67A; --mint-soft:#E1F5EA;
  --peach:#F07F4D; --peach-soft:#FFF0E8;
  --lav:#5FD6A0; --lav-soft:#E3F6EC;
  --gold:#F0B52A; --gold-soft:#FFF4D6;
  --pink:#FF6F91;
  --shadow:0 6px 24px rgba(20,70,45,.09);
  --cellc:#E1EBE2; --h1:#BDE6C8; --h2:#86D09B; --h3:#4FC98A; --h4:#B8F061;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{touch-action:manipulation;overscroll-behavior-y:none;-webkit-text-size-adjust:100%;-moz-text-size-adjust:none;text-size-adjust:100%}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Be Vietnam Pro',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:15px;line-height:1.45}
button{font-family:inherit;color:inherit;border:0;background:none;cursor:pointer}
.app{max-width:1120px;margin:0 auto;padding:18px 16px 100px}
.layout{display:grid;gap:18px;grid-template-columns:minmax(0,1fr)}
.layout>*{min-width:0}
@media(min-width:920px){.layout{grid-template-columns:340px minmax(0,1fr);align-items:start}.side{position:sticky;top:18px}.app{padding-bottom:40px}}

.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:18px;border:1px solid rgba(184,240,97,.13)}
:root[data-theme=light] .card{border-color:var(--line)}
.muted{color:var(--muted)}
h1,h2,h3{margin:0}

/* Side */
.hello{font-size:14px;color:var(--muted)}
.title{font-size:22px;font-weight:800;margin:2px 0 4px;letter-spacing:-.3px}
.meta{font-size:13px;color:var(--muted)}
.ringwrap{display:flex;align-items:center;gap:18px;margin-top:16px}
.ring{position:relative;width:112px;height:112px;flex:none}
.ring svg{transform:rotate(-90deg)}
.ring .lbl{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .pct{font-size:26px;font-weight:800}
.ring .sub{font-size:11px;color:var(--muted)}
.chips{display:grid;gap:8px;flex:1}
.chip{display:flex;align-items:center;gap:10px;background:var(--bg);border-radius:14px;padding:9px 12px}
.chip .e{font-size:20px}
.chip b{font-size:16px;display:block;line-height:1.1}
.chip small{color:var(--muted);font-size:11.5px}
.xpbar{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin-top:12px}
.xpbar i{display:block;height:100%;background:linear-gradient(90deg,var(--primary),var(--lav));border-radius:99px;transition:width .6s}
.xpline{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:6px}
.quote{margin-top:16px;background:linear-gradient(135deg,var(--primary-soft),var(--mint-soft));border-radius:16px;padding:14px 16px}
.quote .k{font-size:11.5px;font-weight:700;color:var(--primary);text-transform:uppercase;letter-spacing:.6px}
.quote p{margin:6px 0 0;font-size:15px;font-weight:600}
.banner{margin-top:12px;background:var(--gold-soft);border-radius:14px;padding:10px 12px;font-size:13px}

/* Tabs */
.tabs{display:none;gap:6px;background:var(--card);padding:6px;border-radius:16px;box-shadow:var(--shadow);margin-bottom:16px}
.tabs button{flex:1;padding:10px;border-radius:12px;font-weight:600;color:var(--muted)}
.tabs button.on{background:var(--primary-soft);color:var(--primary)}
@media(min-width:920px){.tabs{display:flex}}
.bnav{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.96);backdrop-filter:blur(10px);border-top:1px solid var(--line);display:flex;padding:6px 10px calc(8px + env(safe-area-inset-bottom));z-index:20}
.bnav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11.5px;font-weight:600;color:var(--muted);padding:6px 0;border-radius:12px}
.bnav button span{font-size:21px;filter:grayscale(1);opacity:.6}
.bnav button.on{color:var(--primary)}
.bnav button.on span{filter:none;opacity:1}
@media(min-width:920px){.bnav{display:none}}

/* Day nav */
.daynav{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.daynav .arrow{width:40px;height:40px;border-radius:12px;background:var(--card);box-shadow:var(--shadow);font-size:20px;font-weight:700}
.daynav .arrow:disabled{opacity:.3;cursor:default}
.list.ro .chk{opacity:.45}
.daynav .mid{flex:1;text-align:center}
.daynav .mid b{display:block;font-size:16px}
.daynav .mid small{color:var(--muted)}
.pill{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--mint-soft);color:var(--mint);vertical-align:middle}
.pill.go{background:var(--primary-soft);color:var(--primary);cursor:pointer}

/* ---- Công việc ---- */
.wcard{background:var(--card);border-radius:var(--r);padding:14px;border:1px solid rgba(184,240,97,.13);margin-bottom:12px}
.wdead{border-color:rgba(245,196,68,.4);background:linear-gradient(135deg,var(--card),rgba(245,196,68,.08))}
.wdead.late{border-color:rgba(255,111,145,.5)}
.wbar{height:8px;border-radius:9px;background:var(--line);overflow:hidden;margin-top:8px}.wbar i{display:block;height:100%;background:var(--primary)}
.wmo{display:flex;align-items:center;justify-content:space-between;margin:6px 0 10px}.wmo b{font-size:17px}
.wmo button{width:44px;height:44px;border-radius:12px;background:var(--card);color:var(--ink);font-size:18px}.wmo button:disabled{opacity:.3}
.wwk{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
.wwk button{min-height:44px;border-radius:12px;background:var(--card);color:var(--muted);font-weight:700}.wwk button.on{background:var(--primary-soft);color:var(--primary);outline:1.5px solid var(--primary)}
.wwk small{display:block;font-size:10.5px;font-weight:600}
.wrow{display:flex;align-items:center;gap:10px;min-height:48px;padding:8px 0;border-top:1px solid var(--line)}
.wrow .n{flex:1;min-width:0}.wrow .n b{display:block;font-size:14px}.wrow .n small{color:var(--muted);font-size:12px}
.wbtn{min-height:44px;padding:0 16px;border-radius:12px;background:var(--primary);color:#10200f;font-weight:800;font-size:14px}
a.wbtn{text-decoration:none}.wrow .n small{display:block}
.wbtn.ghost{background:var(--bg);color:var(--ink);border:1px solid var(--line)}.wbtn:disabled{opacity:.4}
.wfl{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px;margin:2px 4px 0 0;background:var(--gold-soft);color:var(--gold)}
.wfl.red{background:rgba(255,111,145,.15);color:var(--pink)}.wfl.ok{background:var(--mint-soft);color:var(--mint)}
.wsel,.winp{width:100%;min-height:44px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;font-size:14px;padding:8px 12px;margin-top:6px}
.wfile{display:flex;align-items:center;gap:8px;padding:8px 10px;margin-top:6px;border-radius:10px;background:var(--bg);font-size:13px}.wfile span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wfile button{width:36px;height:36px;color:var(--pink);font-size:18px}
.wtop{display:flex;gap:8px;align-items:center;margin-bottom:12px}.wtop h3{flex:1;font-size:16px}
.wst{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}.wst div{background:var(--card);border-radius:12px;padding:10px;text-align:center}.wst b{display:block;font-size:20px}.wst small{color:var(--muted);font-size:11.5px}
.wfil{display:flex;gap:8px;overflow-x:auto;margin-bottom:10px}.wfil button{min-height:40px;padding:0 14px;border-radius:99px;background:var(--card);color:var(--muted);font-weight:700;white-space:nowrap}.wfil button.on{background:var(--primary-soft);color:var(--primary)}
.wlist .wrow{cursor:pointer}
.wtier label{display:flex;align-items:center;gap:10px;min-height:48px;padding:6px 10px;border-radius:12px;margin-top:6px;background:var(--bg);border:1.5px solid var(--line)}
.sec{display:flex;align-items:baseline;justify-content:space-between;margin:20px 2px 10px}
.sec h3{font-size:16px;font-weight:700}
.sec span{font-size:13px;color:var(--muted)}
.pgf>summary{display:flex;align-items:baseline;justify-content:space-between;margin:14px 2px 8px;cursor:pointer;list-style:none}.pgf>summary::-webkit-details-marker{display:none}.pgf>summary h3{font-size:16px;font-weight:700}.pgf>summary h3::before{content:'▸ ';color:var(--muted)}.pgf[open]>summary h3::before{content:'▾ '}.pgf>summary span{font-size:13px;color:var(--muted)}
.pgf>summary{align-items:center;gap:8px}.pgf>summary h3{flex:1 1 auto;min-width:0;line-height:1.25}.pgf>summary span{flex:0 1 auto;max-width:42%;text-align:right;font-size:12px;line-height:1.25}
.dayprog{height:10px;background:var(--line);border-radius:99px;overflow:hidden}
.dayprog i{display:block;height:100%;background:linear-gradient(90deg,var(--mint),#7EDCB9);border-radius:99px;transition:width .5s}

/* Habit cards */
.list{display:grid;gap:10px}
.habit{background:var(--card);border-radius:16px;box-shadow:var(--shadow);border:2px solid transparent;transition:border-color .2s,background .2s;align-self:start}
.habit .top{display:flex;align-items:center;gap:12px;padding:12px 12px 12px 14px;cursor:pointer;transition:transform .12s}
.habit .top:active{transform:scale(.985)}
.pill2{display:inline-block;font-size:11.5px;font-weight:700;margin:6px 6px 0 0;padding:2px 8px;border-radius:8px;background:var(--primary-soft);color:var(--primary)}
.habit.done .pill2{background:#CFF1E4;color:#1A7F63}
.more{display:inline-block;font-size:11.5px;color:var(--muted);margin-top:6px}
.xp{border-top:1px dashed #DCDFEA;padding:12px 14px 14px;cursor:default}
.xp h4{margin:2px 0 8px;font-size:13px;color:var(--muted);font-weight:600}
.ck,.tg{display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:12px;background:var(--bg);margin-bottom:6px;cursor:pointer;font-size:14px;user-select:none}
.tg{display:inline-flex;margin:0}
.ck i,.tg i,.bi i{width:22px;height:22px;border-radius:7px;border:2px solid #CDD1E0;display:flex;align-items:center;justify-content:center;font-style:normal;font-size:13px;font-weight:800;color:transparent;flex:none;background:#fff}
.ig{margin-bottom:6px}.ig .ln{margin-bottom:0}
.sgw{display:flex;gap:4px;flex:none;align-items:center}
.addsub{flex:none;width:22px;height:22px;border-radius:50%;border:1.5px dashed var(--muted);color:var(--muted);font-size:14px;font-weight:700;line-height:1;padding:0;background:transparent;cursor:pointer}
.sbs{margin:4px 0 0 14px;padding-left:10px;border-left:2px solid var(--primary)}
.sb{display:flex;align-items:center;gap:8px;padding:4px 0;font-size:13px}.sb .st{flex:1;min-width:0}
.sg.sm{width:24px;height:24px;font-size:12px;border-width:1.5px}
.sbx{flex:none;min-width:22px;height:22px;padding:0 3px;font-size:14px;color:var(--muted);opacity:.65;background:transparent;border:0;cursor:pointer}
.sbx.arm{color:#EF6B4A;opacity:1;font-size:12px;font-weight:700}
.sbadd{display:flex;gap:6px;margin:6px 0 0 14px;align-items:center}.sbadd input{flex:1;min-width:0}
.sbadd input{border:1.5px solid #E2E5EF;border-radius:10px;padding:8px 11px;font:inherit;font-size:13.5px;background:#fff;color:var(--ink);outline:none}.sbadd input:focus{border-color:var(--primary)}.sbadd .btn{padding:8px 14px;font-size:13px;border-radius:10px;white-space:nowrap}
html:not([data-theme=light]) .sbadd input{background:#0F1914;border-color:#2F4036;color:var(--ink)}html:not([data-theme=light]) .sbadd input::placeholder{color:#6F8277}
.leg{font-size:11.5px;color:var(--muted);white-space:nowrap;flex:none;margin-left:8px}
.ln{background:var(--bg);border-radius:12px;padding:8px 10px;margin-bottom:6px;display:flex;align-items:center;gap:10px}
.ln .lt{flex:1;min-width:0;font-size:14px}
.seg{display:flex;gap:6px;flex:none}
.sg{width:29px;height:29px;padding:0;border:2px solid transparent;border-radius:50%;font:inherit;font-size:14px;font-weight:800;line-height:1;cursor:pointer;background:#fff;color:var(--muted)}
.sg.g{border-color:#BFEBDC;color:#1A7F63}.sg.r{border-color:#FFD0C0;color:#C4502A}.sg.y{border-color:#F6E0A0;color:#8A6200}
.sg.g.on{background:var(--mint);border-color:var(--mint);color:#fff}
.sg.r.on{background:#EF6B4A;border-color:#EF6B4A;color:#fff}
.sg.y.on{background:var(--gold);border-color:var(--gold);color:#4A3600}
.heat .cell[data-pday]{cursor:pointer}.heat .cell.fut .dn{opacity:.45}.heat .cell.sel{outline:2.5px solid var(--primary);outline-offset:1px}
.pd .prow{padding:8px 0;border-bottom:1px solid var(--line)}.pd .prow:last-child{border-bottom:0}
.pd .pn{font-size:13.5px;font-weight:700;margin-bottom:3px}.pd .okb{color:var(--mint)}
.pd .pln{font-size:13px;display:flex;gap:6px;align-items:baseline;flex-wrap:wrap}.pd .pst{font-size:13px;color:var(--muted)}
.s1{color:#168A66;font-weight:700}.s2{color:#D13F3F;font-weight:700}.s3{color:#B07A00;font-weight:700}.s0{color:var(--muted)}
.pplan .pl{display:block}
.ck.on,.tg.on{background:var(--mint-soft)}
.ck.on i,.tg.on i{background:var(--mint);border-color:var(--mint);color:#fff}
.fld{margin-bottom:10px}
.fld label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:4px}
.fld input,.fld textarea,.li input{width:100%;border:1.5px solid #E2E5EF;border-radius:10px;padding:9px 11px;font:inherit;font-size:14px;background:#fff;color:var(--ink);outline:none}
.fld input:focus,.fld textarea:focus,.li input:focus{border-color:var(--primary)}
.fld textarea{resize:vertical;min-height:44px}
.li{display:flex;gap:8px;align-items:center;margin-bottom:6px}
.li span{font-size:12px;color:var(--muted);width:20px;flex:none}
.btns{display:flex;gap:8px;margin-top:8px}
.btn{padding:8px 14px;border-radius:10px;font-weight:700;font-size:13px;background:var(--primary);color:#fff}
.btn.ghost{background:var(--bg);color:var(--ink)}
.lnk{font-size:12.5px;color:var(--primary);font-weight:700}
.chips2{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.chips2 span{font-size:12.5px;background:var(--bg);padding:4px 10px;border-radius:99px}
.rule{font-size:12px;color:var(--muted);margin-top:8px;line-height:1.55}
.board{margin-top:16px}
.bd.slp{background:rgba(111,191,255,.10)}
.slr{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:13px;margin:6px 0}
.slr input{padding:4px 8px;border-radius:9px;border:1px solid rgba(127,160,200,.35);background:transparent;color:inherit;font:inherit;font-weight:700}
.chals .chal{display:flex;align-items:center;gap:10px;padding:7px 0;border-top:1px solid var(--line)}.chal>div{flex:1;min-width:0}.chal b{display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chal .ci{font-size:18px;width:24px;text-align:center}.chal small{font-size:12px;color:var(--muted);white-space:nowrap}.chal.ok small{color:var(--mint);font-weight:800}.chal.fail{opacity:.55}.chal .bp{margin-top:4px;height:5px;background:var(--line);border-radius:99px;overflow:hidden}.chal .bp i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#4FC98A,#B8F061)}
.medals{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}.medals span{font-size:12px;padding:4px 8px;border-radius:99px;background:var(--bg)}
.gold .gm{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px;padding:7px 0;border-top:1px solid var(--line);font-size:13px}.gold .gm:first-child{border-top:0}.gold .gm b{width:100%;font-size:12px;color:var(--muted)}
.gold .gm span.me{color:var(--primary);font-weight:800}.gold small{color:var(--muted)}
.busyrow{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:6px;font-size:12.5px;color:var(--muted)}.busyrow .lnk{white-space:nowrap;font-weight:700}
.bsf{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}.bsf label{font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:4px}
.bsf input{border:1.5px solid var(--line);border-radius:10px;padding:8px 10px;font:inherit;font-size:14px;background:transparent;color:var(--ink);min-width:0}
.bsf input[data-breason],.bsf .btn{grid-column:1/-1}.bsl{display:flex;flex-direction:column;gap:6px;max-height:40vh;overflow:auto}
.bsi{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:10px;background:var(--bg);font-size:13px}.bsi span{flex:1;min-width:0;color:var(--muted)}.bsi.past{opacity:.6}
.slg{margin-top:8px;font-size:12.5px;color:var(--muted)}.slg summary{cursor:pointer;list-style:none;padding:4px 0}.slg summary::-webkit-details-marker{display:none}
.slok{margin-top:8px;font-size:12.5px;padding:7px 10px;border-radius:10px;background:color-mix(in srgb,var(--gold) 14%,transparent);color:var(--ink)}.slok.ok{background:color-mix(in srgb,var(--mint) 16%,transparent)}
.slv{display:flex;align-items:center;gap:10px;margin-top:8px;padding:8px 10px;border-radius:12px;background:color-mix(in srgb,var(--sc) 18%,transparent);border:1px solid color-mix(in srgb,var(--sc) 45%,transparent)}
.slv b{display:block;font-size:13.5px;color:var(--sc)}.slv small{font-size:12px;opacity:.85}
.sli{font-size:30px;line-height:1;animation:sliB 2.4s ease-in-out infinite}
@keyframes sliB{50%{transform:translateY(-3px) rotate(-6deg)}}
.board .k{font-size:11.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.6px}
.bd{margin-top:8px;border-radius:14px;padding:11px 13px}
.bd .bt{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.4px;display:flex;justify-content:space-between;margin-bottom:4px}
.bi{display:flex;gap:9px;align-items:flex-start;font-size:13.5px;padding:5px 0;cursor:pointer;user-select:none}
.bi i{width:19px;height:19px;border-radius:6px;font-size:11px;margin-top:1px}
.bi.on span{opacity:.75}
.bempty{font-size:12.5px;color:var(--muted);cursor:pointer;padding:4px 0}
.habit .ic{width:46px;height:46px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:23px;flex:none}
.habit .hb{flex:1;min-width:0}
.habit .ht{font-weight:700;font-size:15px}
.habit .num{font-size:11px;font-weight:700;color:var(--muted);margin-right:4px}
.habit .ha{font-size:13px;color:var(--muted);margin-top:2px}
.habit .hm{display:inline-block;font-size:11.5px;margin-top:6px;padding:2px 8px;border-radius:8px;background:var(--gold-soft);color:#9A6A00}
.habit .new{white-space:nowrap;display:inline-block;font-size:10px;font-weight:800;color:#fff;background:var(--pink);border-radius:6px;padding:1px 6px;margin-left:6px;vertical-align:2px}
.habit .hs{font-size:12px;font-weight:700;color:var(--peach)}
.chk{width:38px;height:38px;border-radius:50%;border:2.5px solid #D5D8E6;flex:none;display:flex;align-items:center;justify-content:center;color:transparent;font-size:20px;font-weight:800;transition:all .2s}
.habit.done{border-color:var(--mint);background:linear-gradient(90deg,#fff,var(--mint-soft))}
.habit.done .chk{background:var(--mint);border-color:var(--mint);color:#fff;animation:pop .3s}
.habit.done .ht{color:#1A7F63}
.habit.lock{cursor:default;opacity:.65;box-shadow:none;background:transparent;border:2px dashed #DCDFEA}
.habit.lock .chk{border:0;font-size:18px;color:var(--muted)}
@keyframes pop{0%{transform:scale(.6)}60%{transform:scale(1.15)}100%{transform:scale(1)}}
.pvbar{display:flex;justify-content:space-between;align-items:center;margin:14px 0 8px;padding:10px 14px;border-radius:14px;background:var(--card);box-shadow:var(--shadow);cursor:pointer;font-size:14px;font-weight:600;user-select:none}
.pvbar b{font-size:12px;padding:3px 10px;border-radius:99px;background:var(--line);color:var(--muted)}
.pvbar.on b{background:var(--primary);color:#fff}
.hint{font-size:12.5px;color:var(--muted);text-align:center;margin-top:16px}
.empty{padding:18px;text-align:center;color:var(--muted);background:var(--card);border-radius:16px}

/* Progress */
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(min-width:620px){.stats{grid-template-columns:repeat(4,1fr)}}
.stat{background:var(--card);border-radius:16px;padding:14px;box-shadow:var(--shadow)}
.stat .v{font-size:24px;font-weight:800}
.stat .l{font-size:12px;color:var(--muted)}
.heat{display:grid;grid-template-columns:34px repeat(7,1fr);gap:5px;align-items:center}
.heat .h{font-size:11px;color:var(--muted);text-align:center;font-weight:600}
.heat .wk{font-size:11px;color:var(--muted);font-weight:600}
.cell{aspect-ratio:1;border-radius:7px;background:#EEF0F6;position:relative;cursor:pointer;max-height:42px}
.cell.fut{background:transparent;border:1.5px dashed #E1E4EE;cursor:default}
.cell.none{visibility:hidden}
.cell.tod{outline:2.5px solid var(--primary);outline-offset:1px}
.cell .dn{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:10px;color:rgba(30,34,64,.45);font-weight:600}
.legend{display:flex;gap:6px;align-items:center;font-size:11.5px;color:var(--muted);margin-top:12px;flex-wrap:wrap}
.legend i{width:14px;height:14px;border-radius:4px;display:inline-block}
.bars{display:flex;align-items:flex-end;gap:6px;height:150px;position:relative;padding-top:8px}
.bars .goal{position:absolute;left:0;right:0;border-top:2px dashed var(--gold);font-size:10px;color:#B07F00}
.bars .goal span{position:absolute;right:0;top:-15px;background:#fff;padding:0 4px}
.bar{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px}
.bar i{width:100%;max-width:34px;border-radius:8px 8px 4px 4px;background:linear-gradient(180deg,var(--lav),var(--primary));min-height:3px;transition:height .5s}
.bar i.fut{background:#EEF0F6}
.bar small{font-size:10.5px;color:var(--muted)}
.bar b{font-size:10.5px}
.hrow{display:grid;grid-template-columns:28px 1fr 46px;gap:10px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line)}
.hrow:last-child{border:0}
.hrow .n{font-size:13.5px;font-weight:600;white-space:normal;overflow-wrap:anywhere;line-height:1.35}
.hrow .tr{height:7px;background:var(--line);border-radius:99px;overflow:hidden;margin-top:5px}
.hrow .tr i{display:block;height:100%;border-radius:99px}
.hrow .p{font-weight:700;text-align:right;font-size:13px}

/* Badges */
.lvl{display:flex;gap:16px;align-items:center}
.lvl .big{width:76px;height:76px;border-radius:22px;background:linear-gradient(135deg,var(--primary-soft),var(--mint-soft));display:flex;align-items:center;justify-content:center;font-size:40px;flex:none}
.lvl h2{font-size:20px}
.lvl .big.evbig{width:104px;height:104px;border-radius:26px;padding:4px}
.chip .e.evs{width:34px;height:34px;flex:none}
.ava.evava{background:none;width:54px;height:54px;position:relative;overflow:visible}
.picks{display:grid;grid-template-columns:repeat(auto-fill,minmax(98px,1fr));gap:8px;margin-top:8px}
.pick{background:var(--bg);border:2px solid transparent;border-radius:16px;padding:8px 6px 9px;text-align:center;color:inherit;font:inherit;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
.pick.on{border-color:var(--mint)}
.pick .evp{width:60px;height:60px;position:relative;display:block}
.pick b{font-size:12.5px}.pick small{font-size:10.5px;color:var(--muted);line-height:1.25}

const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pd = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); };
const pad = n => String(n).padStart(2,'0');
const ymd = d => d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate());
const addDays = (s,k) => { const d = pd(s); d.setDate(d.getDate()+k); return ymd(d); };
const dm = s => s.slice(8,10) + '/' + s.slice(5,7);
const pctTxt = p => p == null ? '–' : Math.round(p*100) + '%';
const mondayOf = s => { const d = pd(s); d.setDate(d.getDate() - (d.getDay()+6)%7); return ymd(d); };
/* Tuần theo tháng: 1–7, 8–14, 15–21, 22–28; 29–31 là ngày nghỉ (gắn vào tuần 22–28) */
const blkStart = s => { const n = +s.slice(8); return s.slice(0,8) + pad(n >= 29 ? 22 : 1 + 7*Math.floor((n-1)/7)); };
const blkNext = s => { const n = +s.slice(8); if (n < 22) return s.slice(0,8) + pad(n+7); const d = pd(s); d.setDate(1); d.setMonth(d.getMonth()+1); return ymd(d); };
const blkAdd = (s,k) => { let x = blkStart(s); for (let j = 0; j < k; j++) x = blkNext(x); return x; };
const blkEnd = s => { const b = blkStart(s), n = +b.slice(8); if (n < 22) return addDays(b, 6); const d = pd(b); d.setDate(1); d.setMonth(d.getMonth()+1); d.setDate(0); return ymd(d); };
const restDay = s => +s.slice(8) >= 29;

/* ================== Gọi máy chủ ================== */
const API_URL = 'https://script.google.com/macros/s/AKfycbxbxFDzYyGOJgo0GUbq0AKDb9k_cEjY5GtwLjRwLFX_sC3UxonTs9X_ooBrG5R1FMLZ6A/exec';
/* Dùng chung: trong Apps Script chạy google.script.run, trên GitHub Pages gọi fetch tới API_URL. */
function call(fn, ...args){
  if (typeof google !== 'undefined' && google.script && google.script.run) {
    return new Promise((ok, bad) => {
      google.script.run.withSuccessHandler(ok).withFailureHandler(e => bad(e instanceof Error ? e : new Error(e && e.message || String(e))))[fn](...args);
    });
  }
  return fetch(API_URL, {method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify({fn: fn, args: args})})
    .then(r => r.json())
    .then(o => { if (!o || !o.ok) throw new Error((o && o.error) || 'Lỗi máy chủ'); return o.v; });
}
function dropToken(){ LS.del('rh_token'); LS.del('rh_dc'); LS.del('rh_bc'); }
const isAuthErr = e => /AUTH/.test(e && e.message || '');

/* ================== Đăng nhập ================== */
async function boot(){
  TOKEN = LS.get('rh_token') || '';
  if (TOKEN) return loadData();
  showLogin();
}
const optHtml = (list, last) => { const depts = {}; list.forEach(m => (depts[m.dept] = depts[m.dept] || []).push(m));
  return `<option value="">— Chọn tên —</option>` + Object.keys(depts).sort().map(d => `<optgroup label="${esc(d)}">${depts[d].map(m => `<option value="${esc(m.id)}" ${m.id===last?'selected':''}>${esc(m.name)}</option>`).join('')}</optgroup>`).join(''); };
function drawLogin(list, msg){
  const last = LS.get('rh_last');
  $('#root').innerHTML = `<form class="login card" id="lf">
    <div class="title">${APP}</div>
    <div class="muted" style="margin-bottom:18px">Chọn tên và nhập PIN của bạn</div>
    <div class="fld"><label>Họ tên</label><select id="lm" required>${optHtml(list, last)}</select></div>
    <div class="fld"><label>Mã PIN</label><input id="lp" type="password" inputmode="numeric" autocomplete="current-password" maxlength="8" placeholder="••••" required></div>
    <div class="err-line" id="le">${msg ? esc(msg) : ''}</div>
    <button class="btn big" type="submit" id="lb">Vào app</button>
    <div class="rule" style="text-align:center;margin-top:14px">Chưa có tên hoặc quên PIN? Nhờ quản lý trung tâm cấp lại.</div></form>`;
  $('#lf').addEventListener('submit', async ev => {
    ev.preventDefault();
    const id = $('#lm').value, pin = $('#lp').value.trim();
    if (!id || !pin) return;
    $('#lb').disabled = true; $('#lb').textContent = 'Đang kiểm tra…'; $('#le').textContent = '';
    try { const r = await call('login', id, pin); TOKEN = r.token; LS.set('rh_token', TOKEN); LS.set('rh_last', id); loadData(r.data); }
    catch(e){ $('#le').textContent = e.message; $('#lb').disabled = false; $('#lb').textContent = 'Vào app'; }
  });
}
async function showLogin(msg){
  $('#bnav').style.display = 'none';
  let old = null; try { old = JSON.parse(LS.get('rh_mem') || 'null'); } catch(e){}
  if (old && old.length) drawLogin(old, msg);
  else $('#root').innerHTML = `<div class="login card"><div class="title">${APP}</div><div class="muted" style="margin-bottom:16px">Đang tải danh sách thành viên…</div><div class="spin" style="margin:auto"></div></div>`;
  let list = [];
  try { list = await call('getMembers'); }
  catch(e){ if (!(old && old.length)) $('#root').innerHTML = errBox(e.message); return; }
  LS.set('rh_mem', JSON.stringify(list));
  if (!(old && old.length)) drawLogin(list, msg);
  else if (JSON.stringify(list) !== JSON.stringify(old)){ const sel = $('#lm'); if (sel){ const v = sel.value; sel.innerHTML = optHtml(list, v || LS.get('rh_last')); } }
}
async function doLogout(){
  try { await call('logout', TOKEN); } catch(e){}
  dropToken(); PROFC = {}; TOKEN = ''; D = null; Object.keys(timers).forEach(k => clearTimeout(timers[k])); Object.keys(dirty).forEach(k => delete dirty[k]); BOARD = null; ADMIN = null; showLogin();
}
const errBox = msg => `<div class="err card"><div style="font-size:40px">😕</div><h3 style="margin:8px 0">Chưa tải được dữ liệu</h3><div class="muted">${esc(msg)}</div><button class="btn" onclick="location.reload()">Thử lại</button></div>`;

/* ================== Tải dữ liệu ================== */
let RAWD = null, dcT = 0, PROFC = {}, boardBusy = false;
const dcRead = () => { try { const c = JSON.parse(LS.get('rh_dc') || 'null'); return c && c.u && c.u === LS.get('rh_last') && c.d ? c.d : null; } catch(e){ return null; } };
function dcSave(){ clearTimeout(dcT); dcT = setTimeout(() => { if (RAWD && ME) LS.set('rh_dc', JSON.stringify({u: ME.id, d: RAWD})); }, 300); }
async function loadData(pre){
  let d = pre || null, cached = false;
  if (!d){ const c = dcRead(); if (c){ d = Object.assign({}, c, {today: ymd(new Date())}); cached = true; } }
  if (!d){
    $('#root').innerHTML = '<div class="loading"><div class="spin"></div>Đang tải dữ liệu…</div>';
    try { d = await call('getData', TOKEN); }
    catch(e){ if (isAuthErr(e)) { dropToken(); return showLogin('Phiên đăng nhập đã hết, hãy đăng nhập lại.'); } $('#root').innerHTML = errBox(e.message); return; }
  }
  const wal = walApply(d);
  RAWD = d; buildData(d, cached);
  const fl = wal.map(k => { dirty[k] = 1; return flush(k); });
  if (!BOARD){ try { const b = JSON.parse(LS.get('rh_bc') || 'null'); if (b && b.me === ME.id) BOARD = b; } catch(e){} }
  if (cached) Promise.all(fl).then(refreshData); else dcSave();
  setTimeout(() => { if (D && !boardBusy) loadBoard(); }, 1500);
}
function buildData(d, noAF, keepVi){
  ME = d.me; SETTINGS = d.settings || {unlockAll:false};
  const days = Array.from({length:90}, (_,i) => addDays(ME.start, i));
  const weeks = []; days.forEach(x => { const b = blkStart(x); if (!weeks.includes(b)) weeks.push(b); });
  WKI = days.map(x => weeks.indexOf(blkStart(x)));
  const U0 = blkStart(SETTINGS.unlockFrom || ME.start);   // mở khoá đồng loạt vào ngày 1, 8, 15, 22 hằng tháng
  const habits = d.habits.map((h,k) => Object.assign({}, h, {no:k+1, start: SETTINGS.unlockAll ? ME.start : blkAdd(U0, h.week-1)}));
  D = {u0: U0, today: d.today, days, weeks, habits, daily:{}, weekly:{}, entries:{}, meta:{plans:{}, lists:{}, subs:{}, look:{}, sleep:{}, bd:'', sleepGoal:['',''], busy:{}, gym:[], lazy:{}}, frz:{}};
  habits.forEach(h => { if (/tuần/i.test(h.freq)) D.weekly[h.code] = Array(weeks.length).fill(0); else D.daily[h.code] = Array(90).fill(0); });
  const rows = d.rows || {};
  if (rows.META){ D.meta.plans = rows.META.plans || {}; D.meta.lists = rows.META.lists || {}; D.meta.hist = rows.META.hist || {}; D.meta.subs = rows.META.subs || {}; D.meta.look = rows.META.look || {}; D.meta.sleep = rows.META.sleep || {}; D.meta.bd = rows.META.bd || ''; D.meta.sleepGoal = rows.META.sleepGoal || ['','']; D.meta.busy = rows.META.busy || {}; D.meta.gym = rows.META.gym || []; D.meta.lazy = rows.META.lazy || {}; if (rows.META.bdg) D.meta.bdg = rows.META.bdg; D.meta.tt = rows.META.tt || {}; D.meta.ix = rows.META.ix || {}; D.meta.lvd = rows.META.lvd || {}; D.meta.bdNo = rows.META.bdNo || 0; D.meta.rp = rows.META.rp || ''; }
  Object.keys(rows).forEach(k => {
    const m = k.match(/^([DW]):(\d{4}-\d{2}-\d{2})$/); if (!m) return;
    const isD = m[1] === 'D', pk = m[2], idx = isD ? days.indexOf(pk) : weeks.indexOf(pk);
    if (idx < 0) return;
    const o = rows[k] || {};
    if (isD && o.fz) D.frz[pk] = 1;
    Object.keys(o.h || {}).forEach(c => {
      const e = o.h[c] || {}, arr = isD ? D.daily[c] : D.weekly[c];
      if (!arr) return;
      arr[idx] = e.d ? 1 : 0;

/* Lịch theo tuần tháng: mỗi hàng 1 tuần (1–7, 8–14, 15–21, 22–28), ngày nghỉ 29–31 thành hàng riêng */
function heatGrid(d0, n, cell){
  const dN = addDays(d0, n-1); let h = `<div class="heat">`, b = blkStart(d0), w = 0;
  while (b <= dN){
    const e = blkEnd(b), rest = +b.slice(8) === 22 && e.slice(8) > '28';
    const row = (lab, a, k) => { let x = `<div class="wk">${lab}</div>`; for (let j = 0; j < 7; j++){ const dd = addDays(a, j); x += j < k && dd >= d0 && dd <= dN ? cell(Math.round((pd(dd) - pd(d0))/864e5), dd) : `<div class="cell none"></div>`; } return x; };
    h += row('T' + (++w), b, 7);
    if (rest){ const r0 = b.slice(0,8) + '29'; if (r0 <= dN) h += row('💤', r0, +e.slice(8) - 28); }
    b = blkNext(b);
  }

}

  return s.touch >= 5 ? 'angry' : s.lvup ? 'lvup' : s.milestone ? 'milestone' : s.away ? 'away' : s.first ? 'first' : s.busy ? 'busy' : s.lazy ? 'lazy' : s.early ? 'early' : s.quota ? 'quota'
    : (s.need > 0 && s.need <= 40 && !s.done) ? 'near' : (!s.done && s.broke) ? 'broke' : (!s.done && s.missed) ? 'missed' : s.rest ? 'rest' : s.hour < 6 ? 'dawn' : s.hour >= 22 ? 'late' : '';
}
function sitLine(ln, k, s){
  const L = SIT[ln]; if (!L) return ''; const key = sitKey(s);
  if (!key || !L[key]) return ''; if (!SIT_ALWAYS[key] && Math.random() > .55) return '';
  return fill(pick(L[key]), s, ln, k);
}

function voiceOf(ln, k){ const L = VOICE[ln]; if (!L) return null; let r = L[0]; L.forEach(x => { if (k >= x[0]) r = x; }); return r; }
function stateNow(){
  if (!D) return {left:0, streak:0, need:0, done:false, total:0, hour:new Date().getHours()};
  const s = summary(), lk = levelOf(s.xp), N = LEVELS[lk+1], st = T >= 0 ? dayStat(T) : {done:0, total:0};
  const left = Math.max(0, (st.total || 0) - (st.done || 0)), h = new Date().getHours();
  const o = {left, streak: s.cur || 0, need: N ? N.xp - s.xp : 0, done: st.total > 0 && left === 0, total: st.total || 0, hour: h};
  if (T >= 0 && !PRACTICE){
    o.lazy = isLazy(T); o.busy = isBusy(T); o.rest = isRest(T); o.day = T + 1;
    o.missed = T >= 1 && !okS(T-1);
    let pr = 0; for (let i = T-2; i >= 0 && okS(i); i--) pr++;
    o.broke = o.missed && pr >= 3;
    o.away = T >= 3 && [1,2,3].every(d => dayStat(T-d).done === 0 && !isBusy(T-d));
    o.milestone = [30,60,90].includes(T+1);
    try { o.lvup = lk > 0 && journeyDates()[lk] === D.days[T]; } catch(e){}
    o.early = o.done && h < 9;
    try { const q = QUOTA, w = q && q.weeks && q.weeks.find(x => x.cur);
      if (w && q.left <= 2){ const K = [['run','buổi chạy'],['read','buổi đọc sách'],['ck','buổi cam kết']];
        const sh = K.filter(([k]) => w[k] != null && w[k] < q.need[k]).map(([k,u]) => (q.need[k] - w[k]) + ' ' + u); if (sh.length) o.quota = sh.join(', '); } } catch(e){}
  }
  return o;

}

function runMeProg(){

/* Đoạn mẫu bài đọc sách: điện thoại giải mã bản ghi, đo số phút có giọng, cắt 90 giây (30 giây đầu + 2 đoạn ngẫu nhiên) gửi AI thay vì cả 10 phút. Lỗi/máy yếu → trả null, gửi cả tệp như cũ. */
async function mindSample(blob){

}
document.addEventListener('click', e => { const b = e.target.closest('[data-helpk]'); if (!b) return; const k = +b.dataset.helpk; HELPOPEN = HELPOPEN === k ? -1 : k; render(); const el = document.querySelector(`[data-helpk="${k}"]`); if (el && HELPOPEN === k) el.scrollIntoView({block:'nearest'}); });

/* =================== CHỈ TIÊU TUẦN (đếm từ Sheet tính phạt) =================== */
let QUOTA = null, QBUSY = false, QAT = 0, QAGAIN = false;
async function loadQuota(force){
  if (PRACTICE || !TOKEN) return; if (QBUSY){ if (force) QAGAIN = true; return; } if (!force && QUOTA && Date.now() - QAT < 600000) return;
  if (!QUOTA){ try { const c = JSON.parse(LS.get('rh_q_' + ME.id) || 'null'); if (c && c.ym) QUOTA = c; } catch(e){} }
  QBUSY = true;
  try { QUOTA = await call('quotaMine', TOKEN); QAT = Date.now(); LS.set('rh_q_' + ME.id, JSON.stringify(QUOTA)); if (tab === 'today') render(); }
  catch(e){ QAT = Date.now(); } finally { QBUSY = false; if (QAGAIN){ QAGAIN = false; loadQuota(true); } }
}
function quotaHtml(){
  if (PRACTICE || T < 0) return '';
  if (!QUOTA || (Date.now() - QAT > 600000)) setTimeout(() => loadQuota(), 50);
  const q = QUOTA; if (!q || !q.weeks) return '';
  const K = [['run','🏃','Chạy bộ','buổi chạy'],['read','📚','Đọc sách','buổi đọc sách'],['ck','🤝','Cam kết','buổi cam kết']];
  const mm = +q.ym.slice(5), w = q.weeks.find(x => x.cur), pastMiss = {};
  q.weeks.filter(x => x.past).forEach(x => K.forEach(([k]) => { if (x[k] != null && x[k] < q.need[k]) pastMiss[k] = (pastMiss[k] || 0) + q.need[k] - x[k]; }));
  const miss = K.filter(([k]) => pastMiss[k]).map(([k,ic,,u]) => `${ic} ${pastMiss[k]} ${u}`);
  let body = '', warn = '';
  if (!w) body = `<div class="qrest">💤 Ngày nghỉ (29–31): không tính chỉ tiêu, làm thì vẫn tốt.</div>`;
  else {
    const rows = K.filter(([k]) => w[k] != null).map(([k,ic,n]) => {
      const have = w[k], need = q.need[k], gap = Math.max(0, need - have), cls = !gap ? 'ok' : gap > q.left ? 'bad' : gap === q.left ? 'warn' : '';
      return `<div class="qrow ${cls}"><span>${ic} ${n}</span><div class="qbar"><i style="width:${Math.min(100, Math.round(have/need*100))}%"></i></div><b>${have}/${need}</b></div>`; }).join('');
    if (!rows) return '';
    body = rows;
    const short = K.filter(([k]) => w[k] != null && w[k] < q.need[k]).map(([k,,,u]) => `${q.need[k] - w[k]} ${u}`);
    if (short.length && q.left <= 2) warn = `<div class="qwarn">⏰ Còn ${q.left === 1 ? 'hôm nay' : q.left + ' ngày'}: cần thêm ${short.join(', ')}.</div>`;
  }
  return `<div class="qbox"><div class="qh"><b>📋 Chỉ tiêu tuần${w ? ` ${w.from}–${w.to}/${mm}` : ''}</b>${w ? `<span>còn ${q.left} ngày</span>` : ''}</div>${body}${warn}
    ${miss.length ? `<div class="qmiss">Tháng ${mm} đã thiếu: ${miss.join(' · ')}</div>` : ''}</div>`;
}
let TRACK = null, TBUSY = false, TAT = 0;
async function loadTrack(force){
  if (!TOKEN || TBUSY) return; if (!force && TRACK && Date.now() - TAT < 300000) return;
  TBUSY = true;
  try { TRACK = await call('quotaBoard', TOKEN); TAT = Date.now(); }
  catch(e){ TRACK = TRACK || {error: e.message}; TAT = Date.now(); }
  finally { TBUSY = false; if (tab === 'rank' && rankMode === 'track') render(); }
}
function trackView(){
  if (!TRACK || Date.now() - TAT > 300000) setTimeout(() => loadTrack(), 50);
  const seg = (v, c, label, key) => `<button class="${c===v?'on':''}" data-${key}="${v}">${label}</button>`;
  const top = `<div class="seg">${seg('total',rankMode,'XP','rmode')}${seg('streak',rankMode,'Chuỗi ngày','rmode')}${seg('run',rankMode,'🏅 Thể thao','rmode')}${seg('track',rankMode,'📋 Theo dõi','rmode')}</div>`;
  const q = TRACK;
  if (!q) return top + `<div class="loading" style="min-height:30vh"><div class="spin"></div>Đang tải bảng theo dõi…</div>`;
  if (q.error) return top + `<div class="empty">${esc(q.error)}</div>`;
  const K = [['run','🏃'],['read','📚'],['ck','🤝']];
  const chip = (v, need, w) => v == null ? `<i class="tkc na">–</i>` : `<i class="tkc ${v >= need ? 'ok' : w.past ? 'bad' : w.cur ? 'cur' : 'fut'}">${v}/${need}</i>`;
  const rows = q.rows.slice().sort((a,b) => b.total - a.total || String(a.name).localeCompare(String(b.name), 'vi'));
  const list = rows.map((r,k) => `<div class="tkp ${r.id === q.me ? 'me' : ''}"><div class="tkh"><div class="tkpos">${k < 3 && r.total > 0 ? ['🥇','🥈','🥉'][k] : k + 1}</div><div class="rn"><b>${esc(r.name)}${r.id === q.me ? ' (bạn)' : ''}</b><small>${esc(r.dept)}</small></div><div class="rv">${r.total}<small>lượt</small></div></div>`
    + K.map(([c,ic]) => `<div class="tkr"><span>${ic}</span>${q.weeks.map(w => chip(r[c][w.b-1], q.need[c], w)).join('')}</div>`).join('') + `</div>`).join('');
  const head = `<div class="tkr th"><span></span>${q.weeks.map(w => `<i>T${w.b} · ${w.from}–${w.to}</i>`).join('')}</div>`;
  return top + `<div class="card" style="padding:8px 10px"><div class="muted" style="padding:2px 4px 6px">Tháng ${+q.ym.slice(5)}: 🏃 chạy bộ ${q.need.run}/tuần · 📚 đọc sách ${q.need.read}/tuần · 🤝 cam kết ${q.need.ck}/tuần. Xếp theo tổng số lượt, làm vượt chỉ tiêu vẫn tính (6/5, 7/5…).</div>${head}${list || '<div class="muted" style="padding:12px">Chưa có dữ liệu.</div>'}</div>
    <div class="rule" style="margin-top:10px">Xanh: đủ · Vàng: tuần đang chạy · Đỏ: tuần đã qua còn thiếu · –: miễn hoặc chưa có dữ liệu.</div>`;
}
